# Mosquitto 2.0.x: broker lokalny, tylko z hasłem i ACL (etap 2, k2).
# Plik haseł i ACL powstają przy starcie w /run/mosquitto (entrypoint.sh) z zmiennych środowiskowych.

listener 1883 0.0.0.0
protocol mqtt

allow_anonymous false
password_file /run/mosquitto/passwd
acl_file /run/mosquitto/acl

# Trwałość: sesja ingestu (stały client_id, QoS 1) przetrwa krótką przerwę ingestu lub bazy.
persistence true
persistence_location /mosquitto/data/
autosave_interval 300
persistent_client_expiration 7d

# Bufor wiadomości dla jednej sesji: ok. 66 min przy 20 wiadomościach na sekundę (mapa v2; 80 tys.), z zapasem;
# limit bajtów chroni limit pamięci kontenera (64 MB; zużycie przy pełnej kolejce zmierzone w raporcie E2-PLC2 k2).
# Po przepełnieniu najnowsze są odrzucane.
max_queued_messages 80000
max_queued_bytes 20971520
max_inflight_messages 100
message_size_limit 65536

# Bez statystyk $SYS (nikt ich nie czyta; ACL też ich nie udostępnia).
sys_interval 0

log_dest stdout
log_type error
log_type warning
log_type notice
