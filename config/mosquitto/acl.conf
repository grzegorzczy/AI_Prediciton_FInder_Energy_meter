# Szablon ACL (najmniejsze uprawnienia). entrypoint.sh podstawia nazwy kont z .env i zapisuje
# wynik w /run/mosquitto/acl. Temat: zaklad/linia/urzadzenie/metryka (dokładnie 4 poziomy).
# Wszystko, czego tu nie ma, jest zabronione (w tym $SYS).

user __COLLECTOR_USER__
topic write +/+/+/+

user __INGEST_USER__
topic read +/+/+/+
