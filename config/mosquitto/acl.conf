# Szablon ACL (najmniejsze uprawnienia). entrypoint.sh podstawia nazwy kont z .env i zapisuje
# wynik w /run/mosquitto/acl. Temat: zaklad/linia/urzadzenie/metryka (dokładnie 4 poziomy).
# Wszystko, czego tu nie ma, jest zabronione (w tym $SYS).
# E3-k3 (K1-D2): każde konto pisze tylko do swojej linii. Zakład i linia muszą zgadzać się z config/devices.yaml
# (site/line – prawdziwy sprzęt, simulator.site/line – symulator); pilnuje tego test tests/mqtt/test_broker_acl.py.

user __COLLECTOR_USER__
topic write zaklad1/linia1/+/+

user __SIM_USER__
topic write zaklad1/linia2/+/+

user __INGEST_USER__
topic read +/+/+/+
