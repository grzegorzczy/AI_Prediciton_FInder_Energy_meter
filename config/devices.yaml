# Źródło prawdy o urządzeniach (reguła 3 w CLAUDE.md): żadnych adresów ani numerów rejestrów w kodzie.
# Układ rejestrów PLC: docs/modbus-map.md (kontrakt, wersja 2 od 25.11.2026; collector akceptuje v1 i v2, plc.map_versions).
# Zmiana mapy wymaga decyzji Grzegorza.
# Temat MQTT: {site}/{line}/{device_id}/{metric}; segmenty tylko ASCII, bez spacji (D1).

site: zaklad1
line: linia1

plc:
  id: plc-01
  name: "JUMO variTRON 300"
  host: 192.168.0.246          # DHCP: po zmianie adresu edytujemy tylko tę linię i restartujemy collector
  port: 502
  unit_id: 1
  function: 4                  # Read Input Registers; jedyna używana funkcja (reguła 1: nigdy nie piszemy do PLC)
  read: { start: 0, count: 60 }   # rejestry 0–59 jednym zapytaniem dla obu wersji mapy (na v1 rejestry 44–59 = 0)
  poll_interval_s: 1.0
  timeout_s: 2.0               # limit jednego zapytania; collector nie ponawia w bibliotece (retries=0)
  reconnect: { initial_s: 1, max_s: 10 }   # cofanie wykładnicze po utracie połączenia
  link_metric: link_status     # metryka stanu łącza z PLC (kody: docs/status-codes.md)
  source: real                 # źródło ładunku dla plc-01 (real/sim)
  map_versions: [1, 2]         # wersje mapy akceptowane w rejestrze 2 (v1 i v2 jednocześnie); inna wartość = link_status 3
  heartbeat_timeout_s: 5       # rejestry 0–1 bez zmiany dłużej niż to = "PLC zatrzymany"
  heartbeat: { offset: 0, type: uint32 }
  map_version_register: { offset: 2, type: uint16 }

# Profil = układ jednego bloku rejestrów licznika; offsety względem block_base urządzenia.
profiles:
  finder_7m24:
    block_size: 50
    status: { offset: 0, type: uint16, metric: meter_status }   # 0 OK, 1 COMM_ERROR, 2 NO_DATA (10 liczy collector)
    diagnostics:
      error_code: { offset: 1, type: uint16, metric: meter_error_code }   # publikowany tylko przy meter_status != 0
      error_count: { offset: 2, type: uint16, metric: meter_error_count }
      data_age_ms: { offset: 4, type: uint32, unit: ms, metric: meter_data_age_ms, omit_value: 0xFFFFFFFF }
    metrics:
      active_power: { offset: 6, type: real32, unit: W }
      reactive_power: { offset: 8, type: real32, unit: var }
      apparent_power: { offset: 10, type: real32, unit: VA }
      power_factor: { offset: 12, type: real32, unit: "" }
      frequency: { offset: 14, type: real32, unit: Hz }
      voltage: { offset: 16, type: real32, unit: V }
      current: { offset: 18, type: real32, unit: A }
      # Mapa v2 (since: 2): publikowane tylko przy map_version >= 2 i meter_status = 0.
      # valid_range to FILTR WIARYGODNOŚCI (śmieci, wartości niemożliwe fizycznie), a nie dane katalogowe licznika:
      # wartość spoza zakresu nie jest publikowana (WARNING raz na zmianę stanu).
      thd_voltage: { offset: 40, type: real32, unit: "%", since: 2, valid_range: [0, 100] }
      thd_current: { offset: 42, type: real32, unit: "%", since: 2, valid_range: [0, 1000] }
      phase_angle: { offset: 44, type: real32, unit: "°", since: 2, valid_range: [-180, 180] }   # ujemny przy Q < 0 (zmierzone 25.11)
      meter_temperature: { offset: 46, type: real32, unit: "°C", since: 2, valid_range: [-50, 150] }
      run_time: { offset: 48, type: real32, unit: s, since: 2, valid_range: [0, 4.3e+9] }
    # Stan licznika w Wh = mantysa × 10^wykładnik (nie z REAL kWh, który traci rozdzielczość).
    energy:
      # resolution_wh: rozdzielczość stanu licznika (wykładnik 2 w rejestrze 36 = 100 Wh); trafia do devices.meta (agregaty energii)
      energy_import_wh: { mantissa: 24, exponent: 26, unit: Wh, resolution_wh: 100 }
      energy_export_wh: { mantissa: 27, exponent: 29, unit: Wh, resolution_wh: 100 }
      # Energia bierna (v2): nazwy wg znaku Q, nie kierunku przepływu: n2 przy Q > 0, n4 przy Q < 0 (docs/modbus-map.md)
      reactive_pos_varh: { mantissa: 34, exponent: 36, unit: varh, resolution_varh: 100, since: 2 }
      reactive_neg_varh: { mantissa: 37, exponent: 39, unit: varh, resolution_varh: 100, since: 2 }
    serial: { offset: 30, type: ascii, registers: 4 }

devices:
  - id: finder_7m24_1
    name: "Licznik energii Finder 7M.24 nr 1"
    kind: energy_meter
    source: real
    profile: finder_7m24
    block_base: 10             # rejestry 10–59 (blok 50), czytamy całość (v2 zajmuje offsety 34–49)
    serial: F0183363           # niezgodność = błąd konfiguracji tego licznika
    phases: 1                  # licznik jednofazowy (U1, I1); liczniki symulatora są trójfazowe (E3-k1, U-1)

# Urządzenia symulatora (etap 3, E3-k1): dane `source: sim` publikowane prosto do MQTT (bez PLC), tylko w swojej linii.
# Collector tej sekcji nie czyta; ingest rejestruje urządzenia i przyjmuje ich dane wyłącznie z tematów simulator.site/line.
# Liczniki wirtualne są TRÓJFAZOWE (phases: 3): `voltage` = napięcie fazowe, `current` = prąd jednej fazy przy obciążeniu
# symetrycznym, moce i energia = sumy trzech faz. Finder (wyżej) jest jednofazowy (phases: 1) – etap 4 nie może ich mieszać.
# rated_kw: moc znamionowa maszyny (liczniki) lub moc silnika (pompa; pompa nie publikuje active_power, K0-D9).
# Parametry modeli (E3-k2) to parametry SYMULACJI, nie dane maszyn; progi alarmowe ustala etap 5 (docs/decisions.md).
simulator:
  site: zaklad1
  line: linia2                 # K0-D3: zaklad1/linia1 = prawdziwy sprzęt, zaklad1/linia2 = symulator
  poll_interval_s: 1.0         # okres próbek na żywo; trafia do devices.meta (widoki energii); symulator wymaga 1.0
  t_zero: null                 # U-2/K1-U2: data „teraz” dla degradacji i kotwicy liczników (k7); bez niej live/historia nie startują
  seed: 20261126               # ziarno szumu: zmiana = inne, ale powtarzalne dane
  calendar:                    # S2; czas lokalny z czasem letnim
    timezone: Europe/Warsaw
    shifts:                    # dni ISO: 1 = poniedziałek … 7 = niedziela
      - { days: [1, 2, 3, 4, 5], start: "06:00", end: "22:00" }
      - { days: [6], start: "06:00", end: "14:00" }
    breaks:                    # przerwy planowe w czasie zmian (K2-D1); przerwa kończąca się z końcem zmiany jest ucinana
      - { start: "10:00", minutes: 15 }
      - { start: "13:30", minutes: 30 }
      - { start: "18:00", minutes: 15 }
    holidays: []               # daty YYYY-MM-DD bez pracy
  ambient: { mean_c: 20, swing_c: 3, warmest_hour: 15 }      # temperatura otoczenia (chłodnia, łożysko pompy)
  electrical: { voltage_v: 230, voltage_slow_v: 2.0, voltage_noise_v: 0.3 }
  history: { meter_days: 14, pump_step_s: 60 }               # K0-D1: liczniki 1 s × 14 dni, pompa co 1 min (k5)
  degradation: { days_total: 120, history_progress: 0.70, shape_k: 3.0 }   # K0-D2: historia pompy 84 dni
  devices:
    # thermostat: w fazie wyłączonej grzałki obowiązuje p_idle_kw (pompy obiegowe i sterowanie pracują, K2-U6)
    - id: sim_pasteryzator
      name: "Pasteryzator"
      kind: energy_meter
      source: sim
      phases: 3
      rated_kw: 18
      energy_resolution_wh: 100
      energy_start_wh: 1250000     # stan licznika w kotwicy t_zero − history.meter_days
      model: { type: thermostat, schedule: shifts, cycle_s: 60, on_fraction: 0.65, p_on_kw: 18, p_idle_kw: 2.5,
               p_off_kw: 0.15, pf_run: 0.98, pf_idle: 0.90, pf_off: 0.90 }
    - id: sim_chlodnia
      name: "Agregat chłodniczy"
      kind: energy_meter
      source: sim
      phases: 3
      rated_kw: 11
      energy_resolution_wh: 100
      energy_start_wh: 2480000
      model: { type: compressor, schedule: always, on_min: 14, off_min: 9, ambient_gain: 0.3, p_on_kw: 9.5,
               p_off_kw: 0.4, pf_run: 0.84, pf_off: 0.60 }
    - id: sim_mieszalnik
      name: "Mieszalnik"
      kind: energy_meter
      source: sim
      phases: 3
      rated_kw: 7.5
      energy_resolution_wh: 100
      energy_start_wh: 610000
      model: { type: batch, schedule: shifts, batch_min: 8, mix_min: 6, ramp_s: 20, p_mix_kw: 5.8, p_pause_kw: 0.3,
               p_off_kw: 0.05, pf_run: 0.80, pf_idle: 0.45, pf_off: 0.45 }
    - id: sim_pakowaczka
      name: "Pakowaczka"
      kind: energy_meter
      source: sim
      phases: 3
      rated_kw: 4
      energy_resolution_wh: 100
      energy_start_wh: 390000
      model: { type: continuous, schedule: shifts, p_run_kw: 3.2, swing: 0.15, p_idle_kw: 0.9, p_off_kw: 0.12,
               pf_run: 0.78, pf_idle: 0.50, pf_off: 0.50 }
    # pompa pracuje przez całą zmianę (także w przerwach), stoi poza zmianami (K2-U4); current_a = 11 kW / (√3·400 V·0,86·0,9)
    - id: sim_pump_p101
      name: "Pompa P-101"
      kind: pump
      source: sim
      rated_kw: 11
      model: { type: pump, schedule: shifts, speed_rpm: 2950, flow_m3_h: 40, current_a: 21,
               vibration_good_mm_s: 1.1, vibration_end_mm_s: 7.0, bearing_good_c: 52, bearing_end_c: 78,
               warmup_tau_min: 25, cooldown_tau_min: 40 }
