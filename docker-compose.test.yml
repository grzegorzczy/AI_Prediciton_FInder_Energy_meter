# Testy integracyjne w osobnym projekcie Compose (aip-test): dane w tmpfs, losowe hasla testowe,
# bez gniazda Dockera. Nie dotyka stosu produkcyjnego ani smartWARE.
# Uruchamiaj przez tests/run-tests.sh (ustawia hasla TEST_* i sprzata tylko projekt aip-test).
name: aip-test

services:
  db:
    image: timescale/timescaledb:2.32.1-pg16@sha256:5d7a2f9d9d593315368338aa6054fda37d7707b4a12a912e30dcb7523385e2b4
    environment:
      POSTGRES_DB: energy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?uzyj tests/run-tests.sh}
      NO_TS_TUNE: "true"
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
      - -c
      - max_worker_processes=16
      - -c
      - timescaledb.max_background_workers=8
      - -c
      - timezone=UTC
      - -c
      - timescaledb.telemetry_level=off
      - -c
      - fsync=off
      - -c
      - max_wal_size=192MB        # WAL też leży w tmpfs (pamięć): bez limitu duże wstawienia danych (k7) wyczerpują limit kontenera
      - -c
      - min_wal_size=32MB
    tmpfs:
      - /var/lib/postgresql/data
    shm_size: 128m
    mem_limit: 896m
    memswap_limit: 896m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d energy"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      default:
        aliases: [timescaledb]      # provisioning źródła danych Grafany używa tej nazwy hosta (jak w produkcji)

  grafana:
    # Ta sama wersja, konfiguracja i provisioning co produkcja; losowe hasła; dane w tmpfs.
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    depends_on:
      db:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${TEST_GRAFANA_ADMIN_PASSWORD:?uzyj tests/run-tests.sh}
      GF_SECURITY_SECRET_KEY: ${TEST_GRAFANA_SECRET_KEY:?uzyj tests/run-tests.sh}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Europe/Warsaw
      GF_USERS_DEFAULT_LANGUAGE: pl-PL
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/przeglad.json
      AIP_DB_NAME: energy
      AIP_DB_READER_PASSWORD: ${TEST_APP_READER_PASSWORD:?uzyj tests/run-tests.sh}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    tmpfs:
      - /var/lib/grafana:mode=1777
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2.0.23@sha256:6a332cc7a8dbe011cbc076180cbb76b37c6f0f55809682ea08e7980ef0112ad9
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      MQTT_COLLECTOR_USER: collector
      MQTT_COLLECTOR_PASSWORD: ${TEST_MQTT_COLLECTOR_PASSWORD:?uzyj tests/run-tests.sh}
      MQTT_INGEST_USER: ingest
      MQTT_INGEST_PASSWORD: ${TEST_MQTT_INGEST_PASSWORD:?uzyj tests/run-tests.sh}
    volumes:
      - ./config/mosquitto:/mosquitto/config:ro
    tmpfs:
      - /run/mosquitto
      - /mosquitto/data
    mem_limit: 64m
    memswap_limit: 64m
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "1883"]
      interval: 3s
      timeout: 3s
      retries: 10

  pytest:
    build:
      context: ./tests
    image: aip-pytest:local
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      grafana:
        condition: service_healthy
    environment:
      REPO_DIR: /repo
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_PASSWORD: ${TEST_GRAFANA_ADMIN_PASSWORD:?uzyj tests/run-tests.sh}
      TEST_APP_READER_PASSWORD: ${TEST_APP_READER_PASSWORD:?uzyj tests/run-tests.sh}
      PYTHONPATH: /repo/services/collector/src:/repo/services/ingest/src
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?uzyj tests/run-tests.sh}
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_COLLECTOR_USER: collector
      MQTT_COLLECTOR_PASSWORD: ${TEST_MQTT_COLLECTOR_PASSWORD:?uzyj tests/run-tests.sh}
      MQTT_INGEST_USER: ingest
      MQTT_INGEST_PASSWORD: ${TEST_MQTT_INGEST_PASSWORD:?uzyj tests/run-tests.sh}
    volumes:                       # tylko to, czego testy potrzebują (bez .env)
      - ./config:/repo/config:ro
      - ./db:/repo/db:ro
      - ./docs:/repo/docs:ro
      - ./grafana:/repo/grafana:ro
      - ./services:/repo/services:ro
      - ./tests:/repo/tests:ro
      - ./pytest.ini:/repo/pytest.ini:ro
      - ./docker-compose.yml:/repo/docker-compose.yml:ro
    working_dir: /repo
    command: ["pytest", "-c", "/repo/pytest.ini"]
    mem_limit: 256m
    memswap_limit: 256m
