# Źródło danych: TimescaleDB wyłącznie jako app_reader (zasada 4): rola tylko do odczytu, statement_timeout 10 s,
# CONNECTION LIMIT 10 (K2-U5: pula Grafany 5 + 2, zapas dla czatu z etapu 6). Hasło i nazwa bazy z env kontenera (.env).
apiVersion: 1
datasources:
  - name: AI Predykcja (TimescaleDB)
    uid: aip-timescaledb
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: app_reader
    database: ${AIP_DB_NAME}
    isDefault: true
    editable: false
    jsonData:
      database: ${AIP_DB_NAME}
      sslmode: disable          # sieć wewnętrzna Compose (aip_backend)
      postgresVersion: 1600
      timescaledb: true
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      timeInterval: 1s
    secureJsonData:
      password: ${AIP_DB_READER_PASSWORD}
